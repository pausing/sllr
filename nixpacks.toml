[phases.setup]
nixPkgs = ['python312', 'nodejs_22']

[phases.install]
cmds = [
  'bash scripts/install-node.sh',
  'pip install -r requirements.txt',
  'cd frontend && npm ci'
]

[phases.build]
cmds = [
  'cd frontend && npm run build'
]

[start]
cmd = 'uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
